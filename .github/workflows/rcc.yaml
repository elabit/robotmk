---
name: "RCC"

on:
  workflow_call: {}

env:
  RCC_REF: "v17.29.1_micromamba_v1.5.8_from_github"  # Update omd/Licenses.csv in the Checkmk repo when changing this.
  GO_VERSION: "1.26"
  RUBY_VERSION: "2.7"

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rcc
    steps:
      # Needed for hashing this file.
      - uses: actions/checkout@v7

      # Hashing this file ensures that RCC is rebuilt whenever this file changes.
      - id: cache
        uses: actions/cache@v6
        with:
          key: rcc-${{ hashFiles('.github/workflows/rcc.yaml') }}
          path: rcc/build

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: elabit/rcc
          ref: ${{ env.RCC_REF }}
          path: rcc
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: rcc/go.sum
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ruby/setup-ruby@v1
        with:
            ruby-version: ${{ env.RUBY_VERSION }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: CGO_ENABLED=0 rake build
      - if: steps.cache.outputs.cache-hit != 'true'
        run: rake test
      - if: steps.cache.outputs.cache-hit != 'true'
        run: file build/linux64/rcc | grep "statically linked"

      - uses: actions/upload-artifact@v7
        with:
          name: rcc
          path: rcc/build/
          if-no-files-found: error
